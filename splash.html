<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>WoL Hub</title>
<style>
    * { box-sizing: border-box; }
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0f0f14;
        color: #e8e8ef;
        font-family: -apple-system, "Segoe UI", Arial, sans-serif;
        -webkit-app-region: drag;
        user-select: none;
        overflow: hidden;
    }
    .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        opacity: 0;
        animation: fadeIn 0.35s ease-out forwards;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .logo {
        font-size: 23px;
        font-weight: 700;
        letter-spacing: 0.5px;
    }
    .logo .accent { color: #4fc3f7; }
    .version {
        font-size: 11px;
        color: #6a6a7a;
        margin-top: -10px;
        letter-spacing: 0.3px;
    }
    .spinner {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.12);
        border-top-color: #4fc3f7;
        animation: spin 0.8s linear infinite;
        margin-top: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
        font-size: 12.5px;
        color: #9a9aab;
        min-height: 16px;
    }
    .progress-track {
        width: 180px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        display: none;
    }
    .progress-track.show { display: block; }
    .progress-fill {
        height: 100%;
        width: 0%;
        background: #4fc3f7;
        transition: width 0.2s ease;
    }
</style>
</head>
<body>
    <div class="wrap">
        <div class="logo">WoL <span class="accent">Hub</span></div>
        <div class="version" id="version"></div>
        <div class="spinner"></div>
        <div class="status" id="status">Verificando atualizações...</div>
        <div class="progress-track" id="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <script>
        const statusEl = document.getElementById('status');
        const versionEl = document.getElementById('version');
        const track = document.getElementById('progress-track');
        const fill = document.getElementById('progress-fill');

        const params = new URLSearchParams(location.search);
        const currentVersion = params.get('v');
        if (currentVersion) versionEl.textContent = 'v' + currentVersion;

        window.splashBridge && window.splashBridge.onStatus((text) => {
            statusEl.textContent = text;
        });
        window.splashBridge && window.splashBridge.onProgress((percent) => {
            track.classList.add('show');
            fill.style.width = percent + '%';
        });
    </script>
</body>
</html>
